name: 更新賽程日曆

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"   # 每 6 小時（UTC）跑一次
  workflow_dispatch:          # 可在 Actions 頁面手動執行

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - name: 產生網站與日曆檔
        run: |
          mkdir -p _site/calendar
          cp index.html _site/
          python3 build_ics.py --config calendar-config.json --out _site/calendar
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
